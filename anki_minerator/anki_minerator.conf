# anki_minerator.conf
# Arquivo de configuracao do AnkiMinerator para mpv (Windows)

# URL da API do AnkiConnect (padrao: http://127.0.0.1:8765)
anki_url=http://127.0.0.1:8765

# Sincronizacao automatica com Anki na primeira vez do dia (yes/no)
auto_sync_daily=yes

# Janela em dias para buscar cards adicionados ou editados recentemente
auto_sync_days_back=7

# Nome do baralho (Deck) no Anki onde os cartoes serao inseridos
deck_name=CIMV

# Modelo da nota no Anki (padrao: Basic)
model_name=Basic

# Nomes dos campos do seu modelo no Anki
front_field=Front
back_field=Back

# Caminho de fallback do arquivo TSV exportado do deck (para carga rapida/offline)
tsv_fallback_path=C:\Dev\anki-minerator\CIMV.txt

# Caminho do executavel do FFmpeg (opcional - se vazio, tenta PATH ou usa o proprio mpv como encoder)
ffmpeg_path=

# Margem de audio (em segundos) adicionada antes e depois da legenda ao recortar
audio_padding_start=0.15
audio_padding_end=0.20

# Tamanho da fonte da legenda colorida na tela (OSD ASS)
font_size=28

# Legenda colorida ativada por padrao (yes/no)
color_enabled=yes

# Chave de API do Gemini (OPCIONAL: se vazia, le da variavel de ambiente GEMINI_API_KEY do sistema)
gemini_api_key=

# Modelo da API Gemini (padrao estavel e rapido: gemini-3.5-flash-lite)
gemini_model=gemini-3.5-flash-lite
